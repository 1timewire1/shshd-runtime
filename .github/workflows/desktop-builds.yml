name: Builds

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  packages:
    name: Python wheels (${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: python-${{ matrix.python }}

      - name: Install locked build dependencies
        run: uv sync --locked --extra build

      - name: Build and audit wheels and source archives
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            flags+=(--tag "$GITHUB_REF_NAME")
          fi
          uv run --locked --extra build python tools/build_packages.py "${flags[@]}"

      - name: Verify isolated pip installs and component removal
        run: uv run --locked --extra build python tools/test_packages.py

      - name: Upload Python distributions and checksums
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-packages
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS
    uses: ./.github/workflows/ios-builds.yml

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: linux-x64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-14
          - target: macos-x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      EXP_TARGET: ${{ matrix.target }}
      EXP_BUILD_LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: '3.14'
          enable-cache: true
          cache-suffix: ${{ matrix.target }}

      - name: Install locked dependencies
        run: uv sync --locked --extra build

      - name: Prepare RAR decoder
        run: uv run --locked --extra build python tools/build_rar.py

      - name: Run tests without game content
        run: uv run --locked --extra build python -m unittest discover -s tests

      - name: Build desktop application
        run: uv run --locked --extra build python tools/build_desktop.py

      - name: Package, audit and test the extracted download
        run: >-
          uv run --locked --extra build python tools/package_desktop.py
          --target "$EXP_TARGET" --label "$EXP_BUILD_LABEL" --smoke-test

      - name: Upload downloadable archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.target }}
          path: dist/downloads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-pypi:
    name: Publish Python distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, ios, packages]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/exp-runtime
    permissions:
      id-token: write
    env:
      EXP_TAG: ${{ github.ref_name }}
    steps:
      # Reuse the audited artifacts; do not build or install project code in
      # the job that can request PyPI credentials.
      - name: Download tested Python distributions and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-packages
          path: dist/packages

      - name: Verify checksums and stage only publishable distributions
        working-directory: dist/packages
        shell: bash
        run: |
          version="${EXP_TAG#v}"
          mkdir ../pypi
          for name in exp_runtime exp_runtime_formats exp_runtime_engine exp_runtime_player exp_runtime_shs exp_runtime_cod; do
            for suffix in -py3-none-any.whl .tar.gz; do
              file="$name-$version$suffix"
              sha256sum --check --strict "$file.sha256"
              cp -- "$file" ../pypi/
            done
          done

      - name: Publish wheels and source archives with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi/

  release:
    name: Publish versioned downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, ios, packages]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXP_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download desktop archives and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true

      - name: Download unsigned IPA and checksum
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-arm64-unsigned
          path: dist/release

      - name: Verify downloaded checksums
        working-directory: dist/release
        shell: bash
        run: |
          for target in windows-x64.zip linux-x64.tar.gz macos-arm64.zip macos-x64.zip ios-arm64-unsigned.ipa; do
            test -s "exp-runtime-$EXP_TAG-$target"
            test -s "exp-runtime-$EXP_TAG-$target.sha256"
          done
          sha256sum --check ./*.sha256

      - name: Create release or update its downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if draft=$(gh release view "$EXP_TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release upload "$EXP_TAG" dist/release/* --repo "$GH_REPO" --clobber
            if [[ "$draft" == true ]]; then
              gh release edit "$EXP_TAG" --repo "$GH_REPO" --draft=false
            fi
          else
            flags=()
            if [[ "$EXP_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$EXP_TAG" dist/release/* \
              --repo "$GH_REPO" --verify-tag --title "EXP Runtime $EXP_TAG" \
              --notes-file RELEASE.md "${flags[@]}"
          fi
