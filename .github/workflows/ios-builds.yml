name: iOS builds

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      intel:
        # When GitHub's Apple Silicon runners are short (they have queued past their 15 minutes for hours), an Intel
        # Mac builds the same arm64 device app. Its simulator can't run the arm64 simulator build, so the simulator
        # self-test is skipped; the device app is checked on the iPad instead (shshd-runtime, 2026-11-13).
        description: Build on an Intel Mac (no simulator check)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Unsigned iPhone app
    runs-on: ${{ inputs.intel && 'macos-15-intel' || 'macos-26' }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      EXP_BUILD_LABEL: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select the newest Xcode (Intel)
        if: ${{ inputs.intel }}
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: '3.14'
          enable-cache: true
          cache-suffix: ios

      - name: Install locked host dependencies
        run: uv sync --locked --extra desktop

      - name: Restore iOS dependencies
        id: ios-dependencies-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ios/dependencies
          key: ios-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/dependencies.json', 'tools/build_ios.py') }}

      - name: Prepare iOS dependencies
        run: |
          if [ "${{ inputs.intel }}" != "true" ]; then
            uv run --locked --extra desktop python tools/build_ios.py --prepare --sdk iphonesimulator
          fi
          uv run --locked --extra desktop python tools/build_ios.py --prepare --sdk iphoneos

      # Cache both SDKs before tests or simulator boot can fail.
      - name: Save iOS dependencies
        if: steps.ios-dependencies-cache.outputs.cache-primary-key != '' && steps.ios-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ios/dependencies
          key: ${{ steps.ios-dependencies-cache.outputs.cache-primary-key }}

      - name: Run authored engine and packaging tests
        run: uv run --locked --extra desktop python -m unittest discover -s tests

      - name: Build simulator app
        if: ${{ !inputs.intel }}
        run: uv run --locked --extra desktop python tools/build_ios.py --sdk iphonesimulator

      - name: Verify shared engine and native presentation on iOS
        if: ${{ !inputs.intel }}
        run: uv run --locked --extra desktop python tools/test_ios.py --boot-timeout 600 --install-timeout 300

      - name: Upload simulator failure diagnostics
        if: ${{ failure() && !inputs.intel }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-simulator-diagnostics
          path: build/ios/simulator-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Build unsigned device app
        run: uv run --locked --extra desktop python tools/build_ios.py --sdk iphoneos

      - name: Audit and package unsigned IPA
        run: uv run --locked --extra desktop python tools/package_ios.py --label "$EXP_BUILD_LABEL"

      - name: Upload unsigned IPA and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-arm64-unsigned
          path: |
            dist/downloads/*-ios-arm64-unsigned.ipa
            dist/downloads/*-ios-arm64-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload simulator verification report
        if: ${{ !inputs.intel }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-simulator-verification
          path: build/ios/verification-simulator.json
          if-no-files-found: error
          retention-days: 30
