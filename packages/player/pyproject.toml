[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exp-runtime-player"
version = "0.6.1"
description = "Shared EXP Runtime player and native/desktop rendering"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["exp-runtime-engine[fonts]==0.6.1"]

[project.optional-dependencies]
desktop = ["pygame-ce>=2.5.7,<3"]

[project.gui-scripts]
exp-runtime = "exp_runtime.application:main"
shs = "exp_runtime.application:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["exp_runtime", "exp_runtime.*"]
namespaces = true

[tool.setuptools.package-data]
exp_runtime = ["assets/kiwi.svg"]
