[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exp-runtime-cod"
version = "0.6.0"
description = "Cause of Death adapter for EXP Runtime"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["exp-runtime-engine[fonts]==0.6.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["exp_runtime", "exp_runtime.*"]
namespaces = true
