[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exp-runtime"
version = "0.5.0"
description = "A compatible EXP engine for Surviving High School and Cause of Death using player-supplied game files"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["shs", "surviving-high-school", "cause-of-death", "kiwi", "exp", "game-engine", "shs-runtime", "cod-runtime"]
dependencies = ["exp-runtime-formats==0.5.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
tools = ["exp-runtime-formats==0.5.0"]
engine = ["exp-runtime-engine==0.5.0"]
shs = ["exp-runtime-shs==0.5.0"]
cod = ["exp-runtime-cod==0.5.0"]
player = ["exp-runtime-player[desktop]==0.5.0", "exp-runtime-shs==0.5.0", "exp-runtime-cod==0.5.0"]
desktop = ["exp-runtime-player[desktop]==0.5.0", "exp-runtime-shs==0.5.0", "exp-runtime-cod==0.5.0"]
build = ["exp-runtime-player[desktop]==0.5.0", "exp-runtime-shs==0.5.0", "exp-runtime-cod==0.5.0", "pyinstaller>=6.16,<7"]

# Source contributors get the full test/app environment. Published wheel
# dependencies remain minimal; use --no-default-groups to develop a subset.
[dependency-groups]
dev = ["exp-runtime-player[desktop]==0.5.0", "exp-runtime-shs==0.5.0", "exp-runtime-cod==0.5.0"]

[tool.setuptools]
include-package-data = false
packages = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
exp-runtime-formats = { workspace = true }
exp-runtime-engine = { workspace = true }
exp-runtime-player = { workspace = true }
exp-runtime-shs = { workspace = true }
exp-runtime-cod = { workspace = true }
