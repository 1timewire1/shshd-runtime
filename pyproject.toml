[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shshd-runtime"
version = "1.0.0"
description = "A compatible EXP engine for Surviving High School (including its iPad HD release) and Cause of Death, using player-supplied game files"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["shs", "surviving-high-school", "cause-of-death", "kiwi", "exp", "game-engine", "shs-runtime", "cod-runtime"]
dependencies = ["shshd-runtime-formats==1.0.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
tools = ["shshd-runtime-formats==1.0.0"]
engine = ["shshd-runtime-engine==1.0.0"]
shs = ["shshd-runtime-shs==1.0.0"]
cod = ["shshd-runtime-cod==1.0.0"]
player = ["shshd-runtime-player[desktop]==1.0.0", "shshd-runtime-shs==1.0.0", "shshd-runtime-cod==1.0.0"]
desktop = ["shshd-runtime-player[desktop]==1.0.0", "shshd-runtime-shs==1.0.0", "shshd-runtime-cod==1.0.0"]
build = ["shshd-runtime-player[desktop]==1.0.0", "shshd-runtime-shs==1.0.0", "shshd-runtime-cod==1.0.0", "pyinstaller>=6.16,<7"]

# Source contributors get the full test/app environment. Published wheel
# dependencies remain minimal; use --no-default-groups to develop a subset.
[dependency-groups]
dev = ["shshd-runtime-player[desktop]==1.0.0", "shshd-runtime-shs==1.0.0", "shshd-runtime-cod==1.0.0"]

[tool.setuptools]
include-package-data = false
packages = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
shshd-runtime-formats = { workspace = true }
shshd-runtime-engine = { workspace = true }
shshd-runtime-player = { workspace = true }
shshd-runtime-shs = { workspace = true }
shshd-runtime-cod = { workspace = true }
